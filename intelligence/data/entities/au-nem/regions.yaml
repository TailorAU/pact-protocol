# Structural seed — NEM grid and dispatch regions. See ../../../schemas/entity.schema.json
records:
  - entity_id: grid:au-nem
    entity_type: Grid
    name: National Electricity Market
    aliases: [NEM]
    data_class: structural
    observability: KNOWN_LIVE
    geometry: { type: Point, coordinates: [147.0, -32.0] }
    country: au
    grid_id: null
    properties:
      operator: AEMO
      frequency_hz: 50
      regions: 5
      interconnected_customers_m: 23
    external_ids: {}
    sources: [source:aemo:nem-registration-and-exemption-list, source:aemo:vis-nem-summary]
    notes: >-
      Interconnected east-coast Australian power system spanning QLD, NSW (incl. ACT), VIC, SA and TAS,
      operated by the Australian Energy Market Operator. One of the world's longest AC systems (~5,000 km).

  - entity_id: region:au-nem:qld1
    entity_type: GridRegion
    name: Queensland (QLD1)
    aliases: [QLD1, Queensland region]
    data_class: structural
    observability: KNOWN_LIVE
    geometry: { type: Point, coordinates: [146.0, -22.5] }
    country: au
    admin: { region: Queensland }
    grid_id: grid:au-nem
    properties:
      peak_demand_mw: 11000
      demand_note: approximate record peak
    external_ids:
      aemo_region_id: QLD1
    sources: [source:aemo:nem-registration-and-exemption-list, source:aemo:vis-nem-summary]
    notes: NEM dispatch region for Queensland. Hosts the Gladstone industrial cluster and the Curtis Island LNG export loads.


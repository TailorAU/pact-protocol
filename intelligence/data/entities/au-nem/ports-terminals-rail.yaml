      throughput_note: approximate; the world's largest coal export port (PWCS and NCIG terminals, not modelled separately)
    external_ids:
      unlocode: AUNTL
    sources: [source:wikidata:sparql]
    notes: Hunter Valley coal chain outlet; privatised under long-term lease in 2014.


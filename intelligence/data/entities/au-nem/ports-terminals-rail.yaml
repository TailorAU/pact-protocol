# Structural seed — export ports, terminals and coal rail systems. See ../../../schemas/entity.schema.json
records:
  - entity_id: port:au-qld:gladstone
    entity_type: Port
    name: Port of Gladstone
    aliases: [Gladstone Harbour]
    data_class: structural
    observability: ESTIMATED
    geometry: { type: Point, coordinates: [151.25, -23.83] }
    country: au
    admin: { region: Queensland, locality: Gladstone }
    grid_id: null
    properties:
      harbour_type: natural deepwater
      max_draught_m: 18
      throughput_mtpa: 120
      throughput_note: approximately 120 Mtpa across coal, LNG, alumina, aluminium, bauxite and cement
    external_ids:
      unlocode: AUGLT
    sources: [source:gpc:cargo-statistics, source:wikidata:sparql]
    notes: >-
      Queensland's largest multi-commodity port and one of the world's top coal and LNG export harbours;
      managed by Gladstone Ports Corporation, which publishes monthly cargo statistics (the key public
      observability feed for the cluster). Includes the Curtis Island LNG jetties.


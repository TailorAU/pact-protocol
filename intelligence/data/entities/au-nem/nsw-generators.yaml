records:
  - entity_id: gen:au-nem:eraring
    entity_type: Generator
    name: Eraring Power Station
    aliases: [Eraring]
    data_class: structural
    observability: KNOWN_LIVE
    geometry: { type: Point, coordinates: [151.521, -33.062] }
    country: au
    admin: { region: New South Wales, locality: Eraring }
    grid_id: grid:au-nem
    properties:
      fuel: coal
      capacity_mw: 2880
      technology: steam subcritical
      commissioned: 1982
      unit_count: 4
      status: operating
      closure_announced: "2029-04-30"
    external_ids:
      aemo_duid: [ER01, ER02, ER03, ER04]
      aemo_station_id: ERARING
    sources: [source:aemo:nem-registration-and-exemption-list, source:gem:global-coal-plant-tracker]
    notes: >-
      Australia's largest power station; Origin Energy. Closure was announced for August 2025, extended to August
      2027 under a May 2024 underwriting agreement with the NSW Government, then extended again in February 2026
      to 30 April 2029 (verified Feb 2026 Origin announcement). Co-located Eraring battery (700 MW / 3,160 MWh
      when complete) is a separate asset.


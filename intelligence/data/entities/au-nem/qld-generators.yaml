# Structural seed — Queensland generators (QLD1). See ../../../schemas/entity.schema.json
records:
  - entity_id: gen:au-nem:gladstone-ps
    entity_type: Generator
    name: Gladstone Power Station
    aliases: [GPS]
    data_class: structural
    observability: KNOWN_LIVE
    geometry: { type: Point, coordinates: [151.171, -23.855] }
    country: au
    admin: { region: Queensland, locality: Gladstone }
    grid_id: grid:au-nem
    properties:
      fuel: coal
      capacity_mw: 1680
      technology: steam subcritical
      commissioned: 1976
      unit_count: 6
      status: operating
      closure_announced: "2029-03"
    external_ids:
      aemo_duid: [GSTONE1, GSTONE2, GSTONE3, GSTONE4, GSTONE5, GSTONE6]
      aemo_station_id: GSTONE
    sources: [source:aemo:nem-registration-and-exemption-list, source:gem:global-coal-plant-tracker]
    notes: >-
      Queensland's largest power station; NRG operates for the Gladstone JV (Rio Tinto 42.125%, NRG Energy 37.5%,
      Southern Cross GPS 8.25%, Ryowa II GPS 7.125%, YKK GPS 4.75%). Most output is committed to the Boyne Island
      smelter. On 1 October 2025 CS Energy (as market intermediary) formally notified AEMO of potential retirement
      in March 2029, aligned with expiry of supply and operating arrangements incl. the Boyne Smelters contract;
      no final closure decision has been made (verified Oct 2025 Rio Tinto release).


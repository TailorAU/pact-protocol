# Structural seed — coal mines and resource basins. See ../../../schemas/entity.schema.json
# Production figures are approximate recent-year rates (Mtpa saleable unless noted).
records:
  - entity_id: mine:au-qld:blackwater
    entity_type: CoalMine
    name: Blackwater Mine
    aliases: [Blackwater]
    data_class: structural
    observability: ESTIMATED
    geometry: { type: Point, coordinates: [148.88, -23.70] }
    country: au
    admin: { region: Queensland, locality: Blackwater }
    grid_id: null
    properties:
      mine_type: open-cut
      commodities: [metallurgical coal, thermal coal]
      production_mtpa: 13
      production_note: approximate; one of Australia's largest open-cut coal complexes (~80 km strike)
    external_ids: {}
    sources: [source:gem:global-coal-mine-tracker, source:wikidata:sparql]
    notes: >-
      Sold by BHP Mitsubishi Alliance to Whitehaven Coal (completed April 2024); Whitehaven sold 30% to
      Nippon Steel (20%) and JFE Steel (10%) effective April 2025 (verified). Whitehaven operates. Exports
      via the Blackwater rail system to Gladstone.

